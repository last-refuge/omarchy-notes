name: CI

on:
  push:
  pull_request:

jobs:
  rust-preview:
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 30
    steps:
      - name: Install native build dependencies
        run: pacman -Syu --noconfirm base-devel clang cmake git pkgconf rustup python qt6-base sqlite cairo pango noto-fonts noto-fonts-cjk noto-fonts-emoji ttf-liberation poppler qpdf fontconfig freetype2 libxkbcommon libxcb wayland vulkan-headers vulkan-icd-loader
      - uses: actions/checkout@v4
      - name: Create unprivileged build user
        run: |
          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
      - name: Install pinned Rust toolchain
        run: runuser -u builder -- rustup show
      - name: Check Rust workspace
        env:
          CARGO_BUILD_JOBS: 4
        run: |
          runuser -u builder -- cargo fmt --all --check
          runuser -u builder -- cargo test --workspace --locked
          runuser -u builder -- cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Check Qt-free PDF structure and content
        env:
          CARGO_BUILD_JOBS: 4
        run: |
          runuser -u builder -- cargo build -p notes-export --example pdf-check --locked
          runuser -u builder -- python tests/test-rust-pdf.py target/debug/examples/pdf-check
      - name: Check Rust and Qt storage compatibility
        env:
          CARGO_BUILD_JOBS: 4
        run: |
          runuser -u builder -- cargo build -p omarchy-notes-preview --locked
          runuser -u builder -- cargo build -p notes-storage --example compatibility-edit --locked
          runuser -u builder -- python tests/test-rust-compatibility.py target/debug/omarchy-notes-preview target/debug/examples/compatibility-edit
          runuser -u builder -- cargo build -p notes-storage --example quote-upgrade --locked
          runuser -u builder -- python tests/test-rust-backups.py target/debug/omarchy-notes-preview --quote-driver target/debug/examples/quote-upgrade
          runuser -u builder -- cargo build -p notes-storage --example organization-roundtrip --locked
          runuser -u builder -- python tests/test-rust-organization.py target/debug/examples/organization-roundtrip
      - name: Check durable capture and instance protocol without a display
        env:
          CARGO_BUILD_JOBS: 4
        run: |
          runuser -u builder -- cargo build -p notes-platform --example instance-owner --locked
          runuser -u builder -- python tests/test-rust-capture.py target/debug/omarchy-notes-preview target/debug/examples/instance-owner
      - name: Check editable table compatibility with Qt
        env:
          CARGO_BUILD_JOBS: 4
        run: |
          runuser -u builder -- cargo build -p notes-storage --example table-roundtrip --locked
          runuser -u builder -- python tests/test-rust-tables.py target/debug/examples/table-roundtrip

  installer:
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 5
    steps:
      - name: Install installer test tools
        run: pacman -Syu --noconfirm bash curl python shellcheck sudo util-linux
      - uses: actions/checkout@v4
      - name: Create unprivileged test user
        run: |
          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
      - name: Check installer syntax and lint
        run: |
          bash -n install.sh tests/test-installer.sh tests/test-installer-package.sh
          shellcheck install.sh tests/test-installer.sh tests/test-installer-package.sh
      - name: Test installer without network or system changes
        run: runuser -u builder -- ./tests/test-installer.sh

  build-and-test:
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 30
    steps:
      - name: Install build dependencies
        run: pacman -Syu --noconfirm appstream base-devel cmake desktop-file-utils git ninja qt6-base qt6-declarative qt6-svg sqlite ttf-dejavu
      - uses: actions/checkout@v4
      - name: Create unprivileged test user
        run: |
          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
      - name: Check release metadata
        run: runuser -u builder -- ./tests/test-release-metadata.sh
      - name: Verify production install tree
        run: runuser -u builder -- ./tests/test-package-install.sh
      - name: Build and test
        run: |
          runuser -u builder -- cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          runuser -u builder -- cmake --build build
          runuser -u builder -- env QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software \
            ctest --test-dir build --output-on-failure --timeout 300
      - name: Keep editor screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editor-screenshots
          path: build/screenshots
          if-no-files-found: ignore

  arch-package:
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 30
    steps:
      - name: Install packaging tools
        run: pacman -Syu --noconfirm base-devel curl git namcap python ripgrep sudo util-linux
      - uses: actions/checkout@v4
      - name: Prepare source and AUR files
        run: |
          useradd --create-home builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          chmod 440 /etc/sudoers.d/builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          runuser -u builder -- git config --global --add safe.directory "$GITHUB_WORKSPACE"
          runuser -u builder -- python3 packaging/prepare-release.py --ref HEAD --output build-aur-ci
      # A systemd-nspawn chroot (extra-x86_64-build) can't run inside the
      # job container; the container itself is fresh, and --syncdeps installs
      # only the dependencies the PKGBUILD declares.
      - name: Build the package from the AUR files
        run: runuser -u builder -- bash -c 'cd build-aur-ci/aur && makepkg --syncdeps --noconfirm --cleanbuild'
      - name: Validate package contents and dependencies
        run: ./tests/check-arch-package.sh build-aur-ci/aur
      - name: Install and verify through the installer in the disposable container
        run: runuser -u builder -- ./tests/test-installer-package.sh build-aur-ci/aur

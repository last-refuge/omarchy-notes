name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 30
    steps:
      - name: Install native build dependencies
        run: pacman -Syu --noconfirm base-devel clang cmake git pkgconf rustup python cairo pango noto-fonts noto-fonts-cjk noto-fonts-emoji ttf-liberation poppler qpdf fontconfig freetype2 libxkbcommon libxkbcommon-x11 libxcb wayland vulkan-headers vulkan-icd-loader
      - uses: actions/checkout@v4
      - name: Create unprivileged build user
        run: |
          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
      - name: Install pinned Rust toolchain
        run: runuser -u builder -- rustup show
      - name: Check Rust workspace
        env:
          CARGO_BUILD_JOBS: 4
        run: |
          runuser -u builder -- cargo fmt --all --check
          runuser -u builder -- cargo test --workspace --locked
          runuser -u builder -- cargo test -p accesskit_unix --lib --locked
          runuser -u builder -- cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Check PDF structure and content
        env:
          CARGO_BUILD_JOBS: 4
        run: |
          runuser -u builder -- cargo build -p notes-export --example pdf-check --locked
          runuser -u builder -- python tests/test-rust-pdf.py target/debug/examples/pdf-check
      - name: Check Rust storage and backups
        env:
          CARGO_BUILD_JOBS: 4
        run: |
          runuser -u builder -- cargo build -p omarchy-notes-preview --locked
          runuser -u builder -- cargo build -p notes-storage --example compatibility-edit --locked
          runuser -u builder -- python tests/test-rust-compatibility.py target/debug/omarchy-notes-preview target/debug/examples/compatibility-edit
          runuser -u builder -- cargo build -p notes-storage --example quote-upgrade --locked
          runuser -u builder -- python tests/test-rust-backups.py target/debug/omarchy-notes-preview --quote-driver target/debug/examples/quote-upgrade
          runuser -u builder -- cargo build -p notes-storage --example organization-roundtrip --locked
          runuser -u builder -- python tests/test-rust-organization.py target/debug/examples/organization-roundtrip
          runuser -u builder -- cargo build -p notes-storage --example table-roundtrip --locked
          runuser -u builder -- python tests/test-rust-tables.py target/debug/examples/table-roundtrip
      - name: Check durable capture and instance protocol without a display
        env:
          CARGO_BUILD_JOBS: 4
        run: |
          runuser -u builder -- cargo build -p notes-platform --example instance-owner --locked
          runuser -u builder -- python tests/test-rust-capture.py target/debug/omarchy-notes-preview target/debug/examples/instance-owner

  installer:
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 5
    steps:
      - name: Install installer test tools
        run: pacman -Syu --noconfirm bash curl git python ripgrep shellcheck sudo util-linux
      - uses: actions/checkout@v4
      - name: Create unprivileged test user
        run: |
          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
      - name: Check installer syntax and lint
        run: |
          bash -n install.sh tests/test-installer.sh tests/check-rust-arch-package.sh tests/test-rust-installer-package.sh
          shellcheck install.sh tests/test-installer.sh tests/check-rust-arch-package.sh tests/test-rust-installer-package.sh
      - name: Test installer without network or system changes
        run: runuser -u builder -- ./tests/test-installer.sh
      - name: Check Rust identity and immutable preparation
        run: runuser -u builder -- python3 tests/test_rust_release.py

  rust-arch-candidate:
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 90
    steps:
      - name: Install Rust packaging tools
        run: pacman -Syu --noconfirm appstream base-devel clang cmake curl desktop-file-utils git namcap pkgconf python ripgrep rustup shellcheck sudo util-linux
      - uses: actions/checkout@v4
      - name: Prepare immutable Rust candidate
        run: |
          useradd --create-home builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          chmod 440 /etc/sudoers.d/builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          runuser -u builder -- git config --global --add safe.directory "$GITHUB_WORKSPACE"
          runuser -u builder -- python3 packaging/prepare-release.py --candidate --ref HEAD --output build-rust-ci
      - name: Build from the archived recipe and locked dependencies
        run: runuser -u builder -- bash -c 'cd build-rust-ci/aur && makepkg --syncdeps --noconfirm --cleanbuild'
      - name: Validate package metadata and files
        run: ./tests/check-rust-arch-package.sh build-rust-ci/aur
      - name: Verify install, alias, headless capture and retained data on removal
        run: runuser -u builder -- ./tests/test-rust-installer-package.sh build-rust-ci/aur
      - name: Retain exact candidate identity
        uses: actions/upload-artifact@v4
        with:
          name: rust-candidate-source-identity
          path: |
            build-rust-ci/SOURCE_REVISION
            build-rust-ci/RELEASE_KIND
            build-rust-ci/SHA256SUMS
